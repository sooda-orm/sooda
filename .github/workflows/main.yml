# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ sooda-for-netcore ]
  pull_request:
    branches: [ sooda-for-netcore ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '5.0.x'
    - run: dotnet pack src/Sooda/Sooda.csproj
    - run: dotnet pack src/Sooda.MySql/Sooda.MySql.csproj
    - run: dotnet pack src/Sooda.PostgreSql/Sooda.PostgreSql.csproj
    - run: dotnet pack src/Sooda.SqlServerCore/Sooda.SqlServerCore.csproj
    - run: dotnet pack src/Sooda.TransactionStrategy.ProcessBound/Sooda.TransactionStrategy.ProcessBound.csproj
    - run: dotnet pack src/Sooda.TransactionStrategy.ThreadBound/Sooda.TransactionStrategy.ThreadBound.csproj
    - run: dotnet pack src/Sooda.Logging.NLog47/Sooda.Logging.NLog47.csproj
    - run: dotnet pack src/Sooda.Logging.log4net/Sooda.Logging.log4net.csproj
    
