# This file is a template, and might need editing before it works on your project.
# The following script will work for any project that can be built from command line by msbuild
# It uses powershell shell executor, so you need to add the following line to your config.toml file
# (located in gitlab-runner.exe directory):
#   shell = "powershell"
#
# The script is composed of 3 stages: build, test and deploy.
#
# The build stage restores NuGet packages and uses msbuild to build the exe and msi
# One major issue you'll find is that you can't build msi projects from command line
# if you use vdproj.  There are workarounds building msi via devenv, but they rarely work
# The best solution is migrating your vdproj projects to WiX, as it can be build directly
# by msbuild.
#
# The test stage runs nunit from command line against Test project inside your solution
# It also saves the resulting TestResult.xml file
#
# The deploy stage copies the exe and msi from build stage to a network drive
# You need to have the network drive mapped as Local System user for gitlab-runner service to see it
# The best way to persist the mapping is via a scheduled task (see: https://stackoverflow.com/a/7867064/1288473),
# running the following batch command: net use P: \\x.x.x.x\Projects /u:your_user your_pass /persistent:yes


# place project specific paths in variables to make the rest of the script more generic
variables:
  SOLUTION: 'Sooda.sln'
  CONFIGURATION: 'Debug'
  TEST_FOLDER: 'tests\TestCases\bin\Debug'
  TEST_DLL: 'Sooda.UnitTests.TestCases.dll'
  SOODA_default_connectionString: 'Data Source=$MSSQLSERVER_HOST,$MSSQLSERVER_PORT;Initial Catalog=SoodaUnitTests;User Id=soodatest;Password=PASS123@;Pooling=false'

stages:
  - build
  - test
  - deploy

msbuild:
  stage: build
  tags: [net462sdk, msbuild2019, nuget]
  script:
    - '& "$env:NUGET_EXE" restore $env:SOLUTION'  # restore Nuget dependencies
    - '& dotnet build $env:SOLUTION --configuration=$env:CONFIGURATION --no-incremental '  # build the project
  artifacts:
    expire_in: 1 week  # save gitlab server space, we copy the files we need to deploy folder later on
    paths:
      - '$env:TEST_FOLDER\'  # saving entire Test project so NUnit can run tests

unittests:
  stage: test
  tags: [nunit]
  before_script:
    - 'sqlcmd -S tcp:$env:MSSQLSERVER_HOST,$env:MSSQLSERVER_PORT -U $env:MSSQLSERVER_SA_USER -P $env:MSSQLSERVER_SA_PASS -i tests\Database\mssql\createdb.sql'
# creating a database for testing
  script:
    - 'echo "$env:SOODA_default_connectionString"'
    - '& "$env:NUNIT3_CONSOLE_EXE" ".\$env:TEST_FOLDER\$env:TEST_DLL" $env:NUNIT3_OUTPUT'  # running NUnit tests, exclude database-related tests, output to xml and junit format (for gitlab)
  after_script:
    - 'sqlcmd -S tcp:$env:MSSQLSERVER_HOST,$env:MSSQLSERVER_PORT -U $env:MSSQLSERVER_SA_USER -P $env:MSSQLSERVER_SA_PASS -i tests\Database\mssql\dropdb.sql'
  artifacts:
    when: always            # save test results even when the task fails
    expire_in: 1 week       # save gitlab server space, we copy the files we need to deploy folder later on
    reports:
      junit: '$env:NUNIT3_JUNIT_OUTPUT_FILE'
  dependencies:
    - msbuild


